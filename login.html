<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/auth.css">
    <title>Đăng nhập | Love Cake</title>
</head>
<body>
    <form id="sign up">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="Nhập email của bạn">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu của bạn">
        <label for="confirmPassword">Nhập lại mật khẩu</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required placeholder="Nhập lại mật khẩu của bạn">
        <button type="submit">Đăng ký</button>
    </form>
    <form  id="authForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="Nhập email của bạn">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu của bạn">
        <button type="submit">Đăng nhập</button>
    </form>
</body>
</html>
