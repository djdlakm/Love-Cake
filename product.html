<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh Mục Sản Phẩm | Love Cake</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://kit.fontawesome.com/30260f1add.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/product.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main class="shop-page">
      <!-- ==================== BANNER TIÊU ĐỀ ==================== -->
      <section class="page-banner" aria-labelledby="shop-title">
        <div class="section-container">
          <p class="section-label">Sản phẩm</p>
          <h1 id="shop-title" class="page-title">Danh Mục Sản Phẩm</h1>
        </div>
      </section>

      <!-- ==================== BỘ LỌC + DANH SÁCH ==================== -->
      <section class="shop-layout">
        <div class="section-container shop-layout-inner">
          <!-- ---------- Sidebar bộ lọc ---------- -->
          <aside class="shop-sidebar" aria-label="Bộ lọc sản phẩm">
            <!-- Tìm kiếm -->
            <div class="filter-block">
              <h2 class="filter-title">Tìm kiếm</h2>
              <label class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                  type="search"
                  id="searchInput"
                  placeholder="Tìm bánh..."
                  autocomplete="off"
                />
              </label>
            </div>

            <!-- Danh mục -->
            <div class="filter-block">
              <h2 class="filter-title">Danh mục</h2>
              <ul class="category-filter" id="categoryFilter">
                <li>
                  <button
                    type="button"
                    class="category-item active"
                    data-category="all"
                    data-slug="all"
                  >
                    <span>Tất cả</span><span class="category-num">55</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="category-item"
                    data-category="Bánh hoa quả tươi"
                    data-slug="banh-hoa-qua-tuoi"
                  >
                    <span>Bánh hoa quả tươi</span><span class="category-num">13</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="category-item"
                    data-category="Bánh Kem"
                    data-slug="banh-kem"
                  >
                    <span>Bánh Kem</span><span class="category-num">14</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="category-item"
                    data-category="Bánh Bento"
                    data-slug="banh-bento"
                  >
                    <span>Bánh Bento</span><span class="category-num">10</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="category-item"
                    data-category="Cheese Cake"
                    data-slug="cheese-cake"
                  >
                    <span>Cheese Cake</span><span class="category-num">8</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="category-item"
                    data-category="Mini Cake"
                    data-slug="mini-cake"
                  >
                    <span>Mini Cake</span><span class="category-num">6</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="category-item"
                    data-category="Bánh lễ"
                    data-slug="banh-le"
                  >
                    <span>Bánh lễ</span><span class="category-num">4</span>
                  </button>
                </li>
              </ul>
            </div>
            <!-- Dịp -->
            <div class="filter-block">
              <h2 class="filter-title">Dịp</h2>

              <ul class="occasion-list">
                <li>
                  <button
                    type="button"
                    class="occasion-item active"
                    data-occasion="all"
                  >
                    <span>Tất cả</span>
                  </button>
                </li>

                <li>
                  <button
                    type="button"
                    class="occasion-item"
                    data-occasion="Sinh nhật"
                  >
                    <span>Sinh nhật</span>
                  </button>
                </li>

                <li>
                  <button
                    type="button"
                    class="occasion-item"
                    data-occasion="Cưới"
                  >
                    <span>Cưới</span>
                  </button>
                </li>

                <li>
                  <button
                    type="button"
                    class="occasion-item"
                    data-occasion="Lễ"
                  >
                    <span>Lễ</span>
                  </button>
                </li>
              </ul>
            </div>
            <!-- Khoảng giá -->
            <div class="filter-block">
              <h2 class="filter-title">Khoảng giá</h2>
              <input
                type="range"
                id="priceRange"
                class="price-range"
                min="30000"
                max="800000"
                step="10000"
                value="800000"
                aria-label="Giá tối đa"
              />
              <div class="price-labels">
                <span class="price-min">30.000đ</span>
                <span class="price-max" id="priceMaxLabel">800.000đ</span>
              </div>
            </div>

            <button type="button" class="btn-clear" id="clearFilters">
              Xoá bộ lọc
            </button>
          </aside>

          <!-- ---------- Lưới sản phẩm ---------- -->
          <div class="shop-content">
            <div class="shop-toolbar">
              <div class="shop-result-count">
                <span id="productCount">55</span> sản phẩm
              </div>

              <div class="sort-box">
                <label for="sortSelect">Sắp xếp:</label>
                <select id="sortSelect">
                  <option value="default">Mặc định</option>
                  <option value="price-asc">Giá: thấp → cao</option>
                  <option value="price-desc">Giá: cao → thấp</option>
                </select>
              </div>
            </div>
            <div class="shop-grid" id="productGrid">
            </div>

            <!-- Hiện khi lọc không có kết quả -->
            <div class="no-results" id="noResults" hidden>
              <span class="no-results-icon">🍰</span>
              <h3>Không tìm thấy bánh phù hợp</h3>
              <p>Hãy thử đổi từ khoá hoặc xoá bộ lọc nhé.</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/header&footer.js"></script>
    <script src="js/main.js"></script>
    <script src="js/add-to-cart.js"></script>
    <script src="js/product.js"></script>
  </body>
</html>
